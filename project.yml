name: TimeSink
options:
  bundleIdPrefix: com.justin
  deploymentTarget:
    macOS: "14.0"
  xcodeVersion: "16.0"
  createIntermediateGroups: true
  defaultConfig: Debug

settings:
  base:
    SWIFT_VERSION: "6.0"
    MACOSX_DEPLOYMENT_TARGET: "14.0"
    ENABLE_USER_SCRIPT_SANDBOXING: false

packages:
  GRDB:
    url: https://github.com/groue/GRDB.swift
    from: "7.0.0"
  Sparkle:
    url: https://github.com/sparkle-project/Sparkle
    from: "2.7.0"

targets:
  TimeSink:
    type: application
    platform: macOS
    sources:
      - path: TimeSink/Sources
      - path: TimeSink/Resources
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.justin.timesink
        PRODUCT_NAME: TimeSink
        INFOPLIST_FILE: TimeSink/Info.plist
        CODE_SIGN_ENTITLEMENTS: TimeSink/TimeSink.entitlements
        CODE_SIGN_STYLE: Automatic
        DEVELOPMENT_TEAM: ""
        SWIFT_STRICT_CONCURRENCY: complete
        GENERATE_INFOPLIST_FILE: false
    dependencies:
      - package: GRDB
        product: GRDB
      - package: Sparkle
        product: Sparkle
    entitlements:
      path: TimeSink/TimeSink.entitlements
